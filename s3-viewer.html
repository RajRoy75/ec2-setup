<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 Parquet Logs Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 0.65rem 0.9rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        button {
            background: var(--primary);
            color: white;
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.9rem;
        }

        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-secondary {
            background: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-secondary:hover { background: rgba(59, 130, 246, 0.3); }

        .files-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .files-table th, .files-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .files-table th {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            background: rgba(0,0,0,0.2);
        }

        .files-table tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .file-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #60a5fa;
        }

        /* Log Viewer Section */
        #log-viewer-section {
            display: none;
        }

        .viewer-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.3rem 0.8rem;
            width: 320px;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 0.3rem 0.5rem;
            width: 100%;
        }

        .logs-window {
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 10px;
            height: 65vh;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.83rem;
            padding: 1rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);
        }

        .log-row {
            display: flex;
            gap: 0.8rem;
            padding: 0.25rem 0.4rem;
            border-radius: 4px;
            line-height: 1.4;
            word-break: break-word;
        }

        .log-row:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .log-ts {
            color: #64748b;
            white-space: nowrap;
            user-select: none;
            font-size: 0.78rem;
        }

        .badge-stream {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            text-transform: uppercase;
            height: fit-content;
            user-select: none;
        }

        .badge-stdout { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-stderr { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .log-msg {
            color: #e2e8f0;
            flex: 1;
            white-space: pre-wrap;
        }

        .badge-count {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border-radius: 9999px;
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📦 S3 Parquet Logs Archive Viewer</h1>
        <p>Explore, query, and inspect historical container logs archived in S3</p>
    </div>

    <!-- Filters & Query Card -->
    <div class="card">
        <div class="card-title">🔍 Query S3 Parquet Archive</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Log-Agent Server URL</label>
                <input type="text" id="agent-url" value="http://localhost:8081" placeholder="http://localhost:8081 or EC2 IP">
            </div>

            <div class="form-group">
                <label>Container Name</label>
                <input type="text" id="container-name" placeholder="e.g. nginx, backend, or leave empty">
            </div>

            <div class="form-group">
                <label>Date</label>
                <input type="date" id="log-date">
            </div>

            <div class="form-group">
                <label>Instance ID (Optional)</label>
                <input type="text" id="instance-id" placeholder="leave blank for current instance">
            </div>

            <div>
                <button onclick="fetchFiles()" id="btn-search" style="width: 100%;">
                    <span>🔎 List S3 Files</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Files List Card -->
    <div class="card" id="files-card" style="display: none;">
        <div class="card-title" style="justify-content: space-between;">
            <span>📁 Available Parquet Files (<span id="files-count">0</span>)</span>
        </div>
        <div id="files-container"></div>
    </div>

    <!-- Parquet Log Content Viewer Card -->
    <div class="card" id="log-viewer-section">
        <div class="viewer-toolbar">
            <div style="display: flex; align-items: center; gap: 0.8rem;">
                <h3 style="font-size: 1.1rem;" id="active-file-title">File Details</h3>
                <span class="badge-count" id="active-rows-count">0 rows</span>
            </div>
            <div style="display: flex; gap: 0.6rem; align-items: center;">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="log-filter-input" placeholder="Filter log rows..." oninput="filterLogs()">
                </div>
                <button class="btn-secondary" onclick="exportLogsAsJSON()">💾 Export JSON</button>
                <button class="btn-secondary" onclick="closeViewer()">✕ Close</button>
            </div>
        </div>
        <div class="logs-window" id="logs-window"></div>
    </div>

    <script>
        // Set default date to today in YYYY-MM-DD
        document.getElementById('log-date').value = new Date().toISOString().split('T')[0];

        let currentRecords = [];

        async function fetchFiles() {
            const agentUrl = document.getElementById('agent-url').value.replace(/\/+$/, "");
            const containerName = document.getElementById('container-name').value.trim();
            const date = document.getElementById('log-date').value;
            const instanceId = document.getElementById('instance-id').value.trim();

            const btn = document.getElementById('btn-search');
            btn.disabled = true;
            btn.textContent = "Loading...";

            const filesCard = document.getElementById('files-card');
            const filesContainer = document.getElementById('files-container');
            filesCard.style.display = "block";
            filesContainer.innerHTML = "<div class='status-msg'>Fetching S3 files...</div>";

            try {
                let url = `${agentUrl}/api/archive/files?`;
                if (containerName) url += `container=${encodeURIComponent(containerName)}&`;
                if (date) url += `date=${encodeURIComponent(date)}&`;
                if (instanceId) url += `instance_id=${encodeURIComponent(instanceId)}&`;

                const res = await fetch(url);
                if (!res.ok) throw new Error(await res.text() || "Failed to fetch files");

                const files = await res.json() || [];
                document.getElementById('files-count').textContent = files.length;

                if (files.length === 0) {
                    filesContainer.innerHTML = "<div class='status-msg'>No Parquet log files found matching the criteria in S3.</div>";
                    return;
                }

                let html = `
                    <table class="files-table">
                        <thead>
                            <tr>
                                <th>File Name</th>
                                <th>S3 Key Path</th>
                                <th>Size</th>
                                <th>Last Modified</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                files.forEach(f => {
                    const sizeFormatted = f.size_bytes >= 1024 * 1024 
                        ? (f.size_bytes / (1024 * 1024)).toFixed(2) + " MB"
                        : (f.size_bytes / 1024).toFixed(1) + " KB";

                    const dateFormatted = new Date(f.last_modified).toLocaleString();

                    html += `
                        <tr>
                            <td class="file-name">📄 ${f.file_name}</td>
                            <td style="color: var(--text-muted); font-size: 0.8rem;">${f.key}</td>
                            <td>${sizeFormatted}</td>
                            <td>${dateFormatted}</td>
                            <td>
                                <button class="btn-secondary" style="padding: 0.35rem 0.8rem; font-size: 0.8rem;" onclick="viewParquetFile('${encodeURIComponent(f.key)}', '${f.file_name}')">
                                    👁️ View Logs
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                filesContainer.innerHTML = html;
            } catch (err) {
                filesContainer.innerHTML = `<div class='status-msg' style='color: var(--danger);'>Error: ${err.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "🔎 List S3 Files";
            }
        }

        async function viewParquetFile(encodedKey, fileName) {
            const key = decodeURIComponent(encodedKey);
            const agentUrl = document.getElementById('agent-url').value.replace(/\/+$/, "");

            const viewer = document.getElementById('log-viewer-section');
            const windowEl = document.getElementById('logs-window');
            viewer.style.display = "block";
            document.getElementById('active-file-title').textContent = fileName;
            document.getElementById('log-filter-input').value = "";
            windowEl.innerHTML = "<div class='status-msg'>Downloading and decoding Parquet file from S3...</div>";
            viewer.scrollIntoView({ behavior: 'smooth' });

            try {
                const res = await fetch(`${agentUrl}/api/archive/read?key=${encodeURIComponent(key)}`);
                if (!res.ok) throw new Error(await res.text() || "Failed to read Parquet file");

                currentRecords = await res.json() || [];
                document.getElementById('active-rows-count').textContent = `${currentRecords.length} rows`;

                renderLogs(currentRecords);
            } catch (err) {
                windowEl.innerHTML = `<div class='status-msg' style='color: var(--danger);'>Error: ${err.message}</div>`;
            }
        }

        function renderLogs(records) {
            const windowEl = document.getElementById('logs-window');
            if (!records || records.length === 0) {
                windowEl.innerHTML = "<div class='status-msg'>No matching log lines found.</div>";
                return;
            }

            let html = "";
            records.forEach(r => {
                const date = new Date(r.timestamp / 1000).toISOString();
                const streamClass = r.stream === 'stderr' ? 'badge-stderr' : 'badge-stdout';
                html += `
                    <div class="log-row">
                        <span class="log-ts">${date}</span>
                        <span class="badge-stream ${streamClass}">${r.stream || 'stdout'}</span>
                        <span class="log-msg">${escapeHtml(r.message)}</span>
                    </div>
                `;
            });

            windowEl.innerHTML = html;
        }

        function filterLogs() {
            const q = document.getElementById('log-filter-input').value.toLowerCase().trim();
            if (!q) {
                renderLogs(currentRecords);
                return;
            }

            const filtered = currentRecords.filter(r => 
                (r.message && r.message.toLowerCase().includes(q)) ||
                (r.stream && r.stream.toLowerCase().includes(q))
            );
            renderLogs(filtered);
        }

        function exportLogsAsJSON() {
            if (!currentRecords || currentRecords.length === 0) return;
            const blob = new Blob([JSON.stringify(currentRecords, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `parquet-logs-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function closeViewer() {
            document.getElementById('log-viewer-section').style.display = 'none';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
